version: 2

# Every action is pinned to a commit SHA, the publish and attestation chain
# included. Dependabot rewrites the SHA and leaves the `# vX.Y.Z` comment
# behind, so a bump is still readable.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      test-tools:
        patterns: ["pytest*", "ruff", "coverage*"]
      build-tools:
        patterns: ["build", "twine", "setuptools*", "wheel"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
