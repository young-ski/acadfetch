name: Gates

# One definition of "green", called by CI and by the release. Duplicating these
# steps is how a release ends up shipping what no PR gate ever saw: the two copies
# drift, and the comment claiming they match stays behind.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13", "3.15"]
        include:
          # macOS pays for itself as a signal, not as a blocker.
          - os: macos-latest
            python: "3.12"
            optional: true
          - os: macos-latest
            python: "3.15"
            optional: true
          # The full 3.10-3.15 sweep runs once, here, instead of on every cell:
          # every version is still covered, without 15 lint runs.
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
            lint: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e . pytest pytest-cov ruff
      - name: Lint
        if: matrix.lint != false
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q --cov=acadfetch --cov-fail-under=85
      - name: Warnings are errors where they can be
        # pytest re-emits unraisable warnings under its own category, so the
        # narrow ResourceWarning filter never fires; -W error does.
        if: matrix.python == '3.15' && matrix.os == 'ubuntu-latest'
        run: python -X dev -W error -m pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Metadata and contents
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert not [n for n in names if n.startswith("tests/")], "tests leaked into the wheel"
          assert "acadfetch/py.typed" in names, "py.typed missing from the wheel"
          assert [n for n in names if "licenses/LICENSE" in n], "LICENSE missing from dist-info"
          assert not [n for n in names if n.endswith((".part", ".part.meta.json"))]

          sdist = glob.glob("dist/*.tar.gz")[0]
          archived = tarfile.open(sdist).getnames()
          assert [n for n in archived if "tests/fixtures/" in n], "fixtures missing from the sdist"
          print(f"wheel: {len(names)} entries, sdist: {len(archived)} entries, both as expected")
          PY
      - name: Installs with no dependencies pulled in
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/python -m pip install --no-deps --no-index dist/*.whl
          /tmp/bare/bin/python -c "import acadfetch, sys; print(acadfetch.__name__, sys.version.split()[0])"
          /tmp/bare/bin/acadfetch --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
