name: Release

# Publishing is OIDC-only: no PyPI token lives in this repository. PyPI trusts
# this exact workflow + environment pair, and the job below proves its identity
# with a short-lived id-token instead of a password.
#
# Cut a release with: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A release must not ship what CI has not seen. Same gate, same commands.
      - run: python -m pip install -e . pytest ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import re, pathlib; \
            print(re.search(r'^version = \"(.+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          echo "tag ${GITHUB_REF_NAME} vs version ${version}"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - run: python -m pip install build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name registered on PyPI's trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/acadfetch
    permissions:
      id-token: write # the OIDC token PyPI accepts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
