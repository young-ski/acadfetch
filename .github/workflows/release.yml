name: Release

# Publishing is OIDC-only: no PyPI token lives in this repository. PyPI trusts
# this exact workflow + environment pair, and the publish job proves its identity
# with a short-lived id-token instead of a password.
#
# Cut a release with: git tag v0.1.2 && git push origin v0.1.2
# The tag must be on main and must match `version` in pyproject.toml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two tags pushed together used to race the same PyPI filename.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same gates a PR runs, not a second copy of them: the copy had already
  # drifted (bare `pytest` here, coverage floor and -W error there).
  gates:
    uses: ./.github/workflows/gates.yml

  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: The tag matches the packaged version
        run: |
          version=$(python -c "import re, pathlib; \
            print(re.search(r'^version = \"(.+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          echo "tag ${GITHUB_REF_NAME} vs version ${version}"
          test "v${version}" = "${GITHUB_REF_NAME}"

  publish:
    needs: [gates, guard]
    # A skipped `needs` would otherwise skip this too (that is what makes the
    # tag-only ref check below, rather than the guard, the decision).
    # Dispatch counts only when it is dispatched at a tag; a branch dispatch
    # used to publish a version the guard had never looked at.
    if: >-
      always() && needs.gates.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Must match the environment name registered on PyPI's trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/acadfetch
    permissions:
      id-token: write # the OIDC token PyPI accepts
      attestations: write # the provenance record below
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Say what is about to be uploaded
        run: ls -l dist/ && sha256sum dist/*

      - name: Attach a provenance record to the artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Pinned to a tag rather than `@release/v1`, which is a moving branch.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: false

  # A bad release used to be detectable only by a user complaint.
  smoke:
    needs: publish
    if: always() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the published version, from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            python -m pip install --no-cache-dir "acadfetch==${version}" && break
            echo "not on the index yet ($attempt), waiting"
            sleep 15
          done
          python -m pip install --no-cache-dir "acadfetch==${version}"
      - name: It runs, and it can resolve a real record
        run: |
          acadfetch --version
          acadfetch sources
          acadfetch fetch arxiv:1706.03762 -n
      - name: It downloads and verifies real bytes
        # A dry run proves nothing about transfer, rename or manifest.
        run: |
          acadfetch fetch 10.5281/zenodo.23612969 -q
          acadfetch verify acadfetch-out/zenodo-*/manifest.json
