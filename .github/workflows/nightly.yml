name: Nightly live smoke

# Three fixed public records, really downloaded and verified. An adapter that
# rotted or an API that drifted is then our warning, not a user's bug report.
# Nothing here blocks a pull request: a bad night opens (or appends to) an
# issue, and the next good night closes it.
#
# One target is a direct figshare URL, and figshare's CDN answers 403 with a WAF
# block page from some networks. That failure means "this canary is stale from
# here", not "acadfetch broke", so the two are reported under different labels.
# A single undifferentiated alarm is how a nightly job stops being read.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      expect_failure:
        description: Use a record id that does not exist, to test the alarm
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      # Each target keeps a log only when it fails, so the next step can tell a
      # dead target from a regression without re-running anything.
      - name: Download and verify three real targets
        id: smoke
        env:
          EXPECT_FAILURE: ${{ inputs.expect_failure || false }}
        run: |
          set -uo pipefail
          rm -rf out logs
          mkdir -p logs
          failed=0

          # The alarm self-test: a record that cannot exist must fail.
          if [ "$EXPECT_FAILURE" = "true" ]; then
            python -m acadfetch fetch "zenodo:1" -o out/broken -q || failed=1
          fi

          run_target() {
            name="$1"; target="$2"; shift 2
            log="logs/$name.log"
            if python -m acadfetch fetch "$target" -o "out/$name" -q "$@" >"$log" 2>&1 \
               && python -m acadfetch verify "out/$name/manifest.json" >>"$log" 2>&1; then
              echo "ok   $name"
              rm -f "$log"
              return 0
            fi
            echo "FAIL $name"
            tail -n 5 "$log"
            return 1
          }

          run_target zenodo "10.5281/zenodo.23612969" || failed=1
          run_target arxiv "arxiv:1706.03762" || failed=1
          run_target direct "https://ndownloader.figshare.com/files/70600233/report.pdf" \
            --checksum md5:bbde85208529e663141a0e8cb6fa9c4a || failed=1

          exit $failed

      # A traceback or a refusal of our own making is a regression. An HTTP
      # status, a DNS failure or a timeout from the far end is a stale canary.
      - name: Classify the failure
        id: classify
        if: always() && steps.smoke.outcome == 'failure'
        run: |
          dead=""
          broke=""
          for log in logs/*.log; do
            [ -e "$log" ] && [ -s "$log" ] || continue
            name=$(basename "$log" .log)
            if grep -qE 'Traceback|^acadfetch: cannot tell|^acadfetch: no such|unsupported manifest schema|checksum mismatch|^ *MISMATCH' "$log"; then
              broke="$broke $name"
            else
              dead="$dead $name"
            fi
          done
          echo "dead=${dead# }" >> "$GITHUB_OUTPUT"
          echo "broke=${broke# }" >> "$GITHUB_OUTPUT"
          echo "unreachable:${dead:- none}"
          echo "our-side failures:${broke:- none}"

      - name: Open or update the issue - our side
        if: always() && steps.smoke.outcome == 'failure' && steps.classify.outputs.dead == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=live-smoke
          gh label create "$label" --color B60205 \
            --description "The nightly live smoke failed" 2>/dev/null || true
          excerpt=$(cat logs/*.log 2>/dev/null | tail -n 20 || true)
          body=$(printf 'Nightly live smoke failed at %s.\n\nRun: %s\n\nTargets: zenodo 23612969, arxiv 1706.03762, direct ndownloader 70600233.\n\n```\n%s\n```\n' \
            "$(date -u +%FT%TZ)" "$RUN_URL" "$excerpt")
          existing=$(gh issue list --label "$label" --state open --limit 1 \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live smoke failed ($(date -u +%F))" \
              --label "$label" --body "$body"
          fi

      - name: Open or update the issue - a canary target is unreachable
        if: always() && steps.classify.outputs.dead != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=canary-dead
          gh label create "$label" --color FBCA04 \
            --description "A nightly canary target answers with an error from the far end" 2>/dev/null || true
          excerpt=$(cat logs/*.log 2>/dev/null | tail -n 20 || true)
          body=$(printf 'These canary targets did not answer at %s: %s\n\nRun: %s\n\nThis is not necessarily a bug in acadfetch: the host may be blocking the runner, or the record may be gone. Check the log tail, then replace the target in `.github/workflows/nightly.yml` if it stays dead.\n\n```\n%s\n```\n' \
            "$(date -u +%FT%TZ)" "${{ steps.classify.outputs.dead }}" "$RUN_URL" "$excerpt")
          existing=$(gh issue list --label "$label" --state open --limit 1 \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Canary target unreachable ($(date -u +%F))" \
              --label "$label" --body "$body"
          fi

      - name: Close the issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for label in live-smoke canary-dead; do
            for n in $(gh issue list --label "$label" --state open --limit 5 \
              --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Recovered: $RUN_URL"
            done
          done
