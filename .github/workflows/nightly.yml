name: Nightly live smoke

# Three fixed public records, really downloaded and verified. An adapter that
# rotted or an API that drifted is then our warning, not a user's bug report.
# Nothing here blocks a pull request: a bad night opens (or appends to) an
# issue, and the next good night closes it.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      expect_failure:
        description: Use a record id that does not exist, to test the alarm
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      - name: Download and verify three real targets
        env:
          EXPECT_FAILURE: ${{ inputs.expect_failure || false }}
        run: |
          set -euxo pipefail
          rm -rf out
          if [ "$EXPECT_FAILURE" = "true" ]; then
            python -m acadfetch fetch "zenodo:1" -o out/broken -q
          fi
          python -m acadfetch fetch "10.5281/zenodo.23612969" -o out/zenodo -q
          python -m acadfetch verify out/zenodo/manifest.json
          python -m acadfetch fetch "arxiv:1706.03762" -o out/arxiv -q
          python -m acadfetch verify out/arxiv/manifest.json
          python -m acadfetch fetch \
            "https://ndownloader.figshare.com/files/70600233/report.pdf" \
            --checksum md5:bbde85208529e663141a0e8cb6fa9c4a -o out/direct -q
          python -m acadfetch verify out/direct/manifest.json

      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label=live-smoke
          gh label create "$label" --color B60205 \
            --description "The nightly live smoke failed" 2>/dev/null || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'Nightly live smoke failed at %s.\n\nRun: %s\n\nTargets: zenodo 23612969, arxiv 1706.03762, direct ndownloader 70600233.\n' \
            "$(date -u +%FT%TZ)" "$run_url")
          existing=$(gh issue list --label "$label" --state open --limit 1 \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live smoke failed ($(date -u +%F))" \
              --label "$label" --body "$body"
          fi

      - name: Close the issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label live-smoke --state open --limit 5 \
            --json number --jq '.[].number'); do
            gh issue close "$n" \
              --comment "Recovered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
