name: First success

# Dispatch-only: the numbers here are the E3 profile of the first-success bench.
# Deliberately not on push/PR — a slow zenodo.org must not block a merge. Read the
# uploaded CSV, do not read the colour: today E2 is expected to be red.

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: Attempts per profile
        default: "3"
      ref:
        description: Git ref to measure (defaults to the dispatched branch)
        required: false

permissions:
  contents: read

concurrency:
  group: first-success
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.15"]
        include:
          - os: ubuntu-latest
            python: "3.10" # the floor, once, on the platform that can run it cheaply
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Tool version
        run: python -m acadfetch --version

      # E2: the deterministic profile. One 2 s stall mid-body; the poll loop is
      # what has to survive it. continue-on-error so the run stays green while the
      # defect is open — the CSV row is the evidence, not the colour.
      - name: E2-stall
        continue-on-error: true
        shell: bash
        run: |
          python scripts/netem_proxy.py --port 8899 --rate 1048576 \
            --stall-after 131072 --stall-for 2 > proxy.log 2>&1 &
          sleep 2
          python scripts/first_success.py --env-id "E3-${{ matrix.os }}-${{ matrix.python }}-stall" \
            --attempts ${{ inputs.attempts }} --timeout 180 --csv "bench-${{ matrix.os }}-${{ matrix.python }}.csv" \
            --proxy http://127.0.0.1:8899
          cat proxy.log

      # E1 in CI: same runner, unshaped, as the control for the step above.
      - name: E1-direct
        shell: bash
        run: |
          python scripts/first_success.py --env-id "E3-${{ matrix.os }}-${{ matrix.python }}-direct" \
            --attempts ${{ inputs.attempts }} --timeout 180 --csv "bench-${{ matrix.os }}-${{ matrix.python }}.csv"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.os }}-${{ matrix.python }}
          path: bench-*.csv
          if-no-files-found: warn
