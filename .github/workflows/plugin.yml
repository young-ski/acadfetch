name: Plugin

# The storage plugin lives in this repository but is a second distribution with
# its own dependencies. It gets its own workflow so that acadfetch's CI stays
# free of snakemake, and so a plugin break is attributed to the plugin.

on:
  push:
    branches: [main]
    paths:
      - "snakemake-storage-plugin-acadfetch/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "snakemake-storage-plugin-acadfetch/**"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # acadfetch itself first: the plugin imports the code in this checkout
      # rather than a published wheel, so a break shows up here, not at release.
      - run: python -m pip install -e .
      - run: python -m pip install -e snakemake-storage-plugin-acadfetch --no-deps
      - run: python -m pip install snakemake pytest
      - name: The plugin is found by Snakemake's own plugin registry
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'snakemake-storage-plugin-acadfetch')
          from snakemake_interface_storage_plugins.registry import StoragePluginRegistry
          reg = StoragePluginRegistry()
          reg.collect_plugins()
          assert 'acadfetch' in reg.get_registered_plugins(), reg.get_registered_plugins()
          print('registered:', reg.get_registered_plugins())
          "
      - run: python -m pytest snakemake-storage-plugin-acadfetch/tests -q
      - name: It packages
        run: |
          python -m pip install build twine
          python -m build snakemake-storage-plugin-acadfetch --outdir dist-plugin
          python -m twine check dist-plugin/*
          python - <<'PY'
          import glob, tarfile, zipfile

          wheel = glob.glob("dist-plugin/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "snakemake_storage_plugin_acadfetch/__init__.py" in names, names
          assert [n for n in names if "licenses/LICENSE" in n], "LICENSE missing from dist-info"
          print(f"wheel: {len(names)} entries")
          PY
