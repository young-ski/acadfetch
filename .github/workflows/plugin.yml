name: Plugin

# The storage plugin lives in this repository but is a second distribution with
# its own dependencies. It gets its own callers so that acadfetch's CI stays free
# of snakemake, and so a plugin break is attributed to the plugin.

on:
  push:
    branches: [main]
    paths:
      - "snakemake-storage-plugin-acadfetch/**"
      - ".github/workflows/plugin.yml"
      - ".github/workflows/plugin-gates.yml"
  pull_request:
    paths:
      - "snakemake-storage-plugin-acadfetch/**"
      - ".github/workflows/plugin.yml"
      - ".github/workflows/plugin-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/plugin-gates.yml
