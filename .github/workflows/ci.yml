name: CI

# The gates themselves live in gates.yml, so the release calls exactly these.

on:
  push:
    branches: [main]
  pull_request:
    # No `paths-ignore` for `**/*.md`: since tests/test_claims.py, the docs are a
    # test input. Skipping CI exactly on the changes that can break that test is
    # how it would go stale without anyone noticing.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
