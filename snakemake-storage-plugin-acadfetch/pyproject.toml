[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemake-storage-plugin-acadfetch"
version = "0.1.0"
description = "Snakemake storage plugin: resumable, rate-limited, checksum-verified downloads from data repositories"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "acadfetch>=0.7.1",
  "snakemake-interface-storage-plugins>=4.1.0,<5.0.0",
  "snakemake-interface-common>=1.14.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/young-ski/acadfetch"
Source = "https://github.com/young-ski/acadfetch"

[tool.setuptools.packages.find]
include = ["snakemake_storage_plugin_acadfetch*"]
