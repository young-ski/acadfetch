[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acadfetch"
version = "0.1.0"
description = "Resumable, rate-limited, checksum-verified bulk downloads from academic data repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "young-ski" }]
keywords = ["zenodo", "figshare", "arxiv", "doi", "reproducibility", "download"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

[project.scripts]
acadfetch = "acadfetch.cli:main"

[project.urls]
Homepage = "https://github.com/young-ski/acadfetch"
Source = "https://github.com/young-ski/acadfetch"
Issues = "https://github.com/young-ski/acadfetch/issues"

[tool.setuptools.packages.find]
include = ["acadfetch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.package-data]
acadfetch = ["py.typed"]
