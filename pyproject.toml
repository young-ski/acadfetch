[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acadfetch"
version = "0.1.0"
description = "Resumable, rate-limited, checksum-verified bulk downloads from academic data repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "young-ski" }]
keywords = ["zenodo", "figshare", "arxiv", "doi", "reproducibility", "download"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
acadfetch = "acadfetch.cli:main"

[project.urls]
Homepage = "https://github.com/young-ski/acadfetch"
Issues = "https://github.com/young-ski/acadfetch/issues"

[tool.setuptools.packages.find]
include = ["acadfetch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.package-data]
acadfetch = ["py.typed"]
